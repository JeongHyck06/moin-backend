# 운영 프로파일, SPRING_PROFILES_ACTIVE=prod 로 켜고 값은 환경변수로 주입
# 드라이버는 MySQL 하나뿐이라 DB_URL 에 jdbc:mysql://호스트:3306/moin 형태로 주면 된다
# DB_* 는 기본값을 두지 않아 빠진 채로 뜨지 않고 기동 단계에서 바로 실패

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 운영 API 문서는 기본 비활성, 필요할 때 SWAGGER_ENABLED=true 로 활성화
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# 닉네임만으로 로그인하는 개발용 엔드포인트 차단
moin.dev-login=false

# 서비스 계정 json 경로, 비어 있으면 푸시는 로그로만
moin.fcm.credentials=${FCM_CREDENTIALS:}
# 영상 저장 경로, 재배포에도 살아남는 디스크를 지정할 것
moin.upload-dir=${UPLOAD_DIR:uploads}

# 앱 배포마다 바뀌는 값이라 재빌드 없이 환경변수로 교체
moin.app.min-version=${APP_MIN_VERSION:1.0.0}
moin.app.latest-version=${APP_LATEST_VERSION:1.0.0}
moin.app.ios-store-url=${IOS_STORE_URL:}
moin.app.android-store-url=${ANDROID_STORE_URL:}

# 컨테이너 내부 상태 점검용. 외부 Nginx에서는 /actuator 접근 차단.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

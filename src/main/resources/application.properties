spring.application.name=backend

# 프로파일 없이 뜨면 local, 서버는 SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

# ponytail: 스키마가 아직 자주 바뀌어 update 유지, 굳으면 validate + 마이그레이션 도구
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# users, groups, value 등 예약어 테이블/컬럼명을 그대로 쓰기 위해 전부 따옴표 처리
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Boot 4 에서 server.error.* 는 deprecated, 옛 이름은 바인딩되지 않아 message 가 빠짐
spring.web.error.include-message=always

# 3초 영상 1개, 앱이 길이를 보장하고 서버는 크기만 제한
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB

moin.zone=Asia/Seoul
moin.crisis-hours=2
moin.session-days=90
# 공급자 ID 토큰의 audience, 클라이언트가 보낸 값은 신뢰하지 않음
moin.auth.google-client-ids=${GOOGLE_CLIENT_IDS:}
moin.auth.apple-client-ids=${APPLE_CLIENT_IDS:com.moin}
# 마감 지난 기간을 닫고 리마인더·막차 알림을 보내는 주기(ms)
moin.close-interval-ms=60000

# 검증 자격증명과 실 광고 단위를 준비한 경우에만 구매·광고 기능 활성화
moin.store.apple-key=${APPLE_IAP_KEY_PATH:}
moin.store.apple-key-id=${APPLE_IAP_KEY_ID:}
moin.store.apple-issuer=${APPLE_IAP_ISSUER_ID:}
moin.store.google-credentials=${GOOGLE_PLAY_CREDENTIALS:}
moin.store.allow-sandbox=${IAP_ALLOW_SANDBOX:false}
moin.admob.android-unit=${ADMOB_ANDROID_REWARDED_UNIT:}
moin.admob.ios-unit=${ADMOB_IOS_REWARDED_UNIT:}

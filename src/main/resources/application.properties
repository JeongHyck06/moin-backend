spring.application.name=backend

# ponytail: H2 파일 DB, 운영 전환 시 PostgreSQL 드라이버 + url 만 교체
spring.datasource.url=jdbc:h2:file:./data/moin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# users, groups, value 등 예약어 테이블/컬럼명을 그대로 쓰기 위해 전부 따옴표 처리
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Boot 4 에서 server.error.* 는 deprecated, 옛 이름은 바인딩되지 않아 message 가 빠짐
spring.web.error.include-message=always

# 3초 영상 1개, 앱이 길이를 보장하고 서버는 크기만 제한
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB

moin.zone=Asia/Seoul
moin.crisis-hours=2
moin.session-days=90
# ponytail: 로컬 디스크 저장, 서버 2대 이상이면 VideoStorage 만 S3 로 교체
moin.upload-dir=uploads
# 마감 지난 기간을 닫고 리마인더·막차 알림을 보내는 주기(ms)
moin.close-interval-ms=60000
# Firebase 서비스 계정 json 경로, 비어 있으면 발송 없이 로그만 (파일은 gitignore)
moin.fcm.credentials=
# 앱 시작 시 GET /app/version 으로 강제(min)·권장(latest) 업데이트 안내
moin.app.min-version=1.0.0
moin.app.latest-version=1.0.0
moin.app.ios-store-url=
moin.app.android-store-url=
# 카카오 없이 닉네임만으로 로그인, 운영에서는 반드시 false
moin.dev-login=false

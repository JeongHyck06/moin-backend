spring.application.name=backend

# ponytail: H2 파일 DB, 운영 전환 시 PostgreSQL 드라이버 + url 만 교체
spring.datasource.url=jdbc:h2:file:./data/moin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# users, groups, value 등 예약어 테이블/컬럼명을 그대로 쓰기 위해 전부 따옴표 처리
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

server.error.include-message=always

# 3초 영상 1개, 앱이 길이를 보장하고 서버는 크기만 제한
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB

moin.zone=Asia/Seoul
moin.crisis-hours=2
moin.session-days=90
# ponytail: 로컬 디스크 저장, 서버 2대 이상이면 VideoStorage 만 S3 로 교체
moin.upload-dir=uploads
# 마감 지난 기간을 닫는 주기(ms)
moin.close-interval-ms=60000
# 카카오 없이 닉네임만으로 로그인, 운영에서는 반드시 false
moin.dev-login=false

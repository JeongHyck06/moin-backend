name: moin
services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moin
      MYSQL_USER: moin
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci]
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D moin --execute="SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 2g
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
  backend:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:18080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-com.moin}
      DB_URL: jdbc:mysql://db:3306/moin?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Seoul
      DB_USER: moin
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      UPLOAD_DIR: /app/uploads
      FCM_CREDENTIALS: ${FCM_CREDENTIALS:-}
      APP_MIN_VERSION: ${APP_MIN_VERSION:-1.0.0}
      APP_LATEST_VERSION: ${APP_LATEST_VERSION:-1.0.0}
      IOS_STORE_URL: ${IOS_STORE_URL:-}
      ANDROID_STORE_URL: ${ANDROID_STORE_URL:-}
      APPLE_IAP_KEY_PATH: ${APPLE_IAP_KEY_PATH:-}
      APPLE_IAP_KEY_ID: ${APPLE_IAP_KEY_ID:-}
      APPLE_IAP_ISSUER_ID: ${APPLE_IAP_ISSUER_ID:-}
      GOOGLE_PLAY_CREDENTIALS: ${GOOGLE_PLAY_CREDENTIALS:-}
      IAP_ALLOW_SANDBOX: ${IAP_ALLOW_SANDBOX:-false}
      ADMOB_ANDROID_REWARDED_UNIT: ${ADMOB_ANDROID_REWARDED_UNIT:-}
      ADMOB_IOS_REWARDED_UNIT: ${ADMOB_IOS_REWARDED_UNIT:-}
      TZ: Asia/Seoul
    volumes:
      - uploads:/app/uploads
      - ./secrets:/run/secrets:ro
    networks: [database, outbound]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", http://127.0.0.1:8080/actuator/health]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
networks:
  database: {internal: true}
  outbound: {}
volumes:
  mysql-data:
    external: true
    name: moin-mysql-data
  uploads:
    external: true
    name: moin-uploads
